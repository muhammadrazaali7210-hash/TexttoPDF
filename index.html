<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic PDF Generator & Formatter</title>
    <!-- Tailwind CSS for a modern, sleek tech UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- jsPDF Library for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .custom-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
    </style>
</head>
<body class="custom-gradient min-h-screen text-slate-100 font-sans flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="border-b border-slate-700/50 bg-slate-900/60 backdrop-blur-md px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                PDF Craft Utility
            </h1>
        </div>
        <!-- Corrected Unified Cross-Link Anchor -->
        <a href="https://muhammadrazaali7210-hash.github.io/AliRazaConverter/" 
           target="_blank" 
           class="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-2 shadow-lg shadow-cyan-500/5">
            🔄 Need PDF to Image? Use AliRazaConverter
        </a>
    </header>

    <!-- Main Tool Workspace -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="w-full max-w-2xl bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
            
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-slate-200">Generate Custom PDF</h2>
                <p class="text-xs text-slate-400 mt-1">Input your custom text layout, anchor an image, and compile directly on the white digital canvas.</p>
            </div>

            <div class="space-y-5">
                <!-- Text Inputs Layout -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Your Document Text</label>
                    <textarea id="pdfText" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-emerald-500/50 transition-colors resize-none placeholder:text-slate-600" placeholder="Type or paste your document content here..."></textarea>
                </div>

                <!-- Control Matrix Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Text Alignment Selection -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Text Alignment Placement</label>
                        <select id="textAlignment" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-emerald-500/50 transition-colors appearance-none cursor-pointer">
                            <option value="left">📐 Corner Left (Default)</option>
                            <option value="center">🎯 Center Alignment</option>
                            <option value="right">📐 Corner Right</option>
                        </select>
                    </div>

                    <!-- Image Document Element Anchor -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Integrate Image Element</label>
                        <div class="relative w-full bg-slate-950 border border-slate-800 rounded-xl p-2 flex items-center text-sm text-slate-400">
                            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <span id="fileNameDisplay" class="text-xs px-2 truncate text-slate-500">No image attached (Optional)</span>
                        </div>
                    </div>
                </div>

                <!-- Compilation Trigger Button -->
                <button id="generateBtn" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-semibold text-sm py-4 rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/20 tracking-wide cursor-pointer">
                    ⚡ Compile & Export PDF Document
                </button>
            </div>

        </div>
    </main>

    <!-- Professional Architecture Footer -->
    <footer class="text-center py-4 border-t border-slate-800/40 text-[11px] text-slate-500 tracking-wider uppercase">
        Engineered via Engine Architecture Matrix &bull; Client-Side Sandbox Deployment
    </footer>

    <!-- Core App Logic Engine Link -->
    <script src="app.js"></script>
</body>
</html>
